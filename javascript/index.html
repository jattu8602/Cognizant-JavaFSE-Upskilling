<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Portal — JavaScript Edition</title>
  <link rel="stylesheet" href="../css3/styles.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    #eventContainer { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
    .event-card { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .event-card h3 { margin: 0 0 8px; }
    .event-card .seats { color: #28a745; font-weight: bold; }
    .event-card .seats.full { color: #dc3545; }
    .event-card .date { color: #6c757d; font-size: 0.9em; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background: #007BFF; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    input, select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
    #formErrors { color: #dc3545; margin: 10px 0; }
    #loadingSpinner { display: none; text-align: center; padding: 20px; font-size: 1.2em; }
    .hidden { display: none; }
    #searchBox { margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Community Event Portal — JavaScript</h1>

  <!-- Ex1: Alert on load -->
  <div id="statusBar"></div>

  <!-- Ex8: Filter by category -->
  <div>
    <label>Filter by category:
      <select id="categoryFilter" onchange="filterByCategory(this.value)">
        <option value="all">All</option>
        <option value="tech">Technology</option>
        <option value="music">Music</option>
        <option value="art">Art & Culture</option>
      </select>
    </label>
    <input type="text" id="searchBox" placeholder="Search by name..." onkeydown="quickSearch(event)">
  </div>

  <!-- Ex7: Event cards rendered here -->
  <div id="eventContainer"></div>

  <!-- Ex8: Register button will call registerUser -->
  <div id="registrationPanel">
    <h3>Register for Event</h3>
    <form id="regForm" onsubmit="return handleFormSubmit(event)">
      <input type="text" id="regName" name="name" placeholder="Your name" required>
      <input type="email" id="regEmail" name="email" placeholder="Your email" required>
      <select id="regEventSelect" name="eventSelect"></select>
      <button type="submit" id="registerBtn">Register</button>
      <div id="formErrors"></div>
    </form>
    <p id="formResult"></p>
  </div>

  <!-- Ex9: Loading spinner -->
  <div id="loadingSpinner">Loading events...</div>

  <!-- jQuery for Ex14 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
