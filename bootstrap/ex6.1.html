<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6.1 - Responsive Flex Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="d-flex flex-column flex-md-row justify-content-between align-items-center p-3 bg-dark text-white">
    <a class="text-white text-decoration-none mb-2 mb-md-0" href="#"><strong>Brand</strong></a>
    <ul class="d-flex flex-column flex-md-row list-unstyled gap-3 mb-0">
      <li><a class="text-white text-decoration-none" href="#">Home</a></li>
      <li><a class="text-white text-decoration-none" href="#">About</a></li>
      <li><a class="text-white text-decoration-none" href="#">Contact</a></li>
    </ul>
  </nav>
  <div class="container mt-5">
    <h1>Exercise 6.1</h1>
    <p>Navbar uses <code>d-flex flex-column flex-md-row</code> — stacks vertically on mobile, horizontal on desktop.</p>
  </div>
</body>
</html>
