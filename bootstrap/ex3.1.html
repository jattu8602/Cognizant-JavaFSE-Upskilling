<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.1 - Responsive Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 3.1 - Responsive Columns</h1>
    <p>3 cols on desktop, 2 on tablet, 1 on mobile.</p>
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4 border p-3 bg-light">Column 1</div>
      <div class="col-12 col-md-6 col-lg-4 border p-3 bg-info">Column 2</div>
      <div class="col-12 col-md-6 col-lg-4 border p-3 bg-light">Column 3</div>
    </div>
  </div>
</body>
</html>
