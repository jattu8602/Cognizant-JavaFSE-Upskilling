<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13.1 - Dashboard Colors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-12 bg-primary text-white p-4"><h2>Header</h2></div>
    </div>
    <div class="row">
      <div class="col-md-3 bg-warning p-4">Sidebar (bg-warning)</div>
      <div class="col-md-9 p-4">
        <div class="bg-success text-white p-3 mb-2">Card 1 (bg-success)</div>
        <div class="bg-danger text-white p-3 mb-2">Card 2 (bg-danger)</div>
        <div class="bg-info text-white p-3">Card 3 (bg-info)</div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 bg-dark text-white p-3 text-center">Footer</div>
    </div>
  </div>
</body>
</html>
