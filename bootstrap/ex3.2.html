<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.2 - Container, Row, Col</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 3.2</h1>
    <div class="row">
      <div class="col-4 border p-3 bg-danger text-white">col-4</div>
      <div class="col-4 border p-3 bg-success text-white">col-4</div>
      <div class="col-4 border p-3 bg-primary text-white">col-4</div>
    </div>
    <hr>
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6 border p-3 bg-warning">col-sm-6</div>
        <div class="col-sm-6 border p-3 bg-secondary text-white">col-sm-6</div>
      </div>
    </div>
  </div>
</body>
</html>
