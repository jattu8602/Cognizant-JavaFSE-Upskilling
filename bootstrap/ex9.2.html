<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 9.2 - Button Groups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 9.2 - Button Groups & Toggles</h1>
    <div class="btn-group mb-3" role="group">
      <button class="btn btn-outline-primary">Left</button>
      <button class="btn btn-primary">Middle</button>
      <button class="btn btn-outline-primary">Right</button>
    </div>
    <br>
    <div class="btn-group" role="group" data-bs-toggle="buttons">
      <input type="checkbox" class="btn-check" id="check1" autocomplete="off">
      <label class="btn btn-outline-success" for="check1">Check 1</label>
      <input type="checkbox" class="btn-check" id="check2" autocomplete="off">
      <label class="btn btn-outline-success" for="check2">Check 2</label>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
