<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.2 - Reordering Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 5.2 - Column Reordering</h1>
    <div class="row">
      <div class="col-md-4 order-md-2 border p-3 bg-info">Second on mobile / First on desktop (order-md-2)</div>
      <div class="col-md-8 order-md-1 border p-3 bg-warning">First on mobile / Second on desktop (order-md-1)</div>
    </div>
  </div>
</body>
</html>
