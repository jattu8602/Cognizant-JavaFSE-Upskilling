<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 17.2 - Icon Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 17.2 - Icon-Only Buttons</h1>
    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
    <button class="btn btn-danger"><i class="bi bi-trash"></i></button>
    <button class="btn btn-success"><i class="bi bi-check-lg"></i></button>
    <button class="btn btn-warning"><i class="bi bi-star"></i></button>
    <button class="btn btn-info"><i class="bi bi-info-circle"></i></button>
    <hr>
    <button class="btn btn-outline-secondary"><i class="bi bi-pencil"></i> Edit</button>
    <button class="btn btn-outline-danger"><i class="bi bi-heart"></i> Like</button>
  </div>
</body>
</html>
