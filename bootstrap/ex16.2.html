<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 16.2 - Badge Overlay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 16.2 - Overlay Badge</h1>
    <div class="position-relative d-inline-block">
      <img src="https://via.placeholder.com/300x200" class="rounded" alt="">
      <span class="position-absolute top-0 start-0 badge bg-danger m-2">Sale!</span>
      <span class="position-absolute bottom-0 end-0 badge bg-primary m-2">New</span>
    </div>
  </div>
</body>
</html>
